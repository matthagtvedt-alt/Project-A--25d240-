<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="summer()">
        Klikk
    </button>
    <div id="utskrift"></div>
    <script>
        let samling = [1,2,3,4,5,6]
        let sum = 0

        function summer() {
           for (let tall = 0; tall < samling.length; tall++) {
            sum += samling[tall]
           }
           document.getElementById("utskrift").innerHTML = `Summen av tallet i samlingen er: ${sum}`
        }

    </script>
</body>
</html>
