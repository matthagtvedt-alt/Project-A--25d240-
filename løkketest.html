<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Løkker</h1>

    <button onclick="lagTall()">Knapp</button>
    <div id="rekke"></div>
    <script>
        function lagTall(){
            let i;
            let innhold = "";
            let x;

            for (x = 0; x <= 0; x++)

            for (i = 0; i <= 256; i++) {
                if (i % 16 == 0)
                innhold += (x++) + " x 16 = " + i + "<br>"
            }

            
            document.getElementById("rekke").innerHTML = innhold;
        }
    </script>
</body>
</html>
